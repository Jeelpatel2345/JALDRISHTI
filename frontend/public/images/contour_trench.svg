<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyTrench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="url(#skyTrench)"/>

  <!-- Sloping Ridge Mountain (Solapur / Anantapur) -->
  <polygon points="0,500 0,160 800,280 800,500" fill="#4ade80"/>
  
  <!-- Continuous Contour Trenches along slope -->
  <!-- Trench 1 -->
  <path d="M40,240 Q400,270 760,330" stroke="#0284c7" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M40,246 Q400,276 760,336" stroke="#92400e" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Trench 2 -->
  <path d="M30,310 Q380,340 770,400" stroke="#0284c7" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M30,316 Q380,340 770,406" stroke="#92400e" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Trench 3 -->
  <path d="M20,380 Q400,410 780,470" stroke="#0284c7" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M20,386 Q400,410 780,476" stroke="#92400e" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Afforested saplings along bunds -->
  <circle cx="120" cy="225" r="14" fill="#15803d"/>
  <circle cx="260" cy="240" r="16" fill="#166534"/>
  <circle cx="440" cy="260" r="15" fill="#15803d"/>
  <circle cx="620" cy="285" r="18" fill="#14532d"/>

  <circle cx="100" cy="295" r="15" fill="#15803d"/>
  <circle cx="300" cy="315" r="17" fill="#166534"/>
  <circle cx="500" cy="335" r="16" fill="#14532d"/>
  <circle cx="700" cy="365" r="19" fill="#15803d"/>

  <!-- Forensic Badge Overlay -->
  <rect x="25" y="25" width="350" height="58" rx="12" fill="#0f172a" fill-opacity="0.85"/>
  <text x="42" y="48" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">CONTINUOUS CONTOUR TRENCHES</text>
  <text x="42" y="68" fill="#94a3b8" font-family="sans-serif" font-size="11">Staggered Infiltration • 65% Runoff Trapped</text>
</svg>
