<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="masonryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="greenBank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="260" fill="url(#skyGrad)"/>

  <!-- Distant Hills -->
  <path d="M0,220 Q180,140 380,210 T800,190 L800,300 L0,300 Z" fill="#86efac" opacity="0.6"/>
  <path d="M0,240 Q220,180 500,230 T800,220 L800,340 L0,340 Z" fill="#4ade80" opacity="0.7"/>

  <!-- Stream Banks (Vegetative Riparian Zone) -->
  <path d="M0,250 C120,250 180,280 200,500 L0,500 Z" fill="url(#greenBank)"/>
  <path d="M800,250 C680,250 620,280 600,500 L800,500 Z" fill="url(#greenBank)"/>

  <!-- Trees & Shrubs on Banks -->
  <circle cx="90" cy="270" r="30" fill="#14532d"/>
  <circle cx="140" cy="290" r="38" fill="#166534"/>
  <circle cx="70" cy="310" r="35" fill="#15803d"/>
  <circle cx="710" cy="270" r="32" fill="#14532d"/>
  <circle cx="660" cy="290" r="40" fill="#166534"/>
  <circle cx="730" cy="310" r="34" fill="#15803d"/>

  <!-- Upstream Impounded Water Reservoir -->
  <path d="M190,270 L610,270 L640,360 L160,360 Z" fill="url(#waterGrad)"/>

  <!-- Masonry Check Dam Wall / Crest -->
  <polygon points="150,330 650,330 640,390 160,390" fill="url(#masonryGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Masonry Blocks Pattern -->
  <line x1="200" y1="330" x2="200" y2="390" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>
  <line x1="280" y1="330" x2="280" y2="390" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>
  <line x1="360" y1="330" x2="360" y2="390" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>
  <line x1="440" y1="330" x2="440" y2="390" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>
  <line x1="520" y1="330" x2="520" y2="390" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>
  <line x1="600" y1="330" x2="600" y2="390" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- Overflow Spillway Waterfall -->
  <path d="M260,350 L540,350 L560,440 L240,440 Z" fill="#e0f2fe" opacity="0.9"/>
  <path d="M280,350 L520,350 L540,440 L260,440 Z" fill="#ffffff" opacity="0.8"/>

  <!-- Water Foam & Splash lines -->
  <ellipse cx="400" cy="440" rx="170" ry="14" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="400" cy="445" rx="150" ry="10" fill="#bae6fd" opacity="0.7"/>

  <!-- Downstream Flowing Water Basin -->
  <path d="M180,440 L620,440 L600,500 L200,500 Z" fill="#0284c7" opacity="0.95"/>

  <!-- Forensic Badge Overlay -->
  <rect x="25" y="25" width="280" height="58" rx="12" fill="#0f172a" fill-opacity="0.85"/>
  <text x="42" y="48" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">MASONRY CHECK DAM</text>
  <text x="42" y="68" fill="#94a3b8" font-family="sans-serif" font-size="11">Impoundment: 18,500 m³ • Verified</text>
</svg>
