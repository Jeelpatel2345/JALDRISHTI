<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyPond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="pondWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="url(#skyPond)"/>

  <!-- Agricultural Farm Landscape -->
  <rect y="200" width="800" height="300" fill="#15803d"/>

  <!-- Crop rows in background -->
  <line x1="0" y1="230" x2="800" y2="230" stroke="#16a34a" stroke-width="4"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#16a34a" stroke-width="4"/>

  <!-- Farm Pond Excavation Embankment -->
  <polygon points="120,270 680,270 740,470 60,470" fill="#92400e" stroke="#78350f" stroke-width="6"/>

  <!-- Stored Water Basin -->
  <polygon points="150,290 650,290 700,450 100,450" fill="url(#pondWater)"/>

  <!-- Water Ripple lines -->
  <line x1="200" y1="350" x2="600" y2="350" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="380" x2="550" y2="380" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="410" x2="500" y2="410" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>

  <!-- Solar Pump / Micro-Irrigation Inlet -->
  <rect x="180" y="275" width="30" height="20" fill="#1e293b"/>
  <line x1="195" y1="295" x2="195" y2="330" stroke="#38bdf8" stroke-width="4"/>

  <!-- Forensic Badge Overlay -->
  <rect x="25" y="25" width="320" height="58" rx="12" fill="#0f172a" fill-opacity="0.85"/>
  <text x="42" y="48" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">COMMUNITY FARM POND</text>
  <text x="42" y="68" fill="#94a3b8" font-family="sans-serif" font-size="11">Capacity: 4,200 m³ • Protective Irrigation</text>
</svg>
