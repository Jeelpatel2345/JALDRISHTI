<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyAlwar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="grassChauka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="dykeBund" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="200" fill="url(#skyAlwar)"/>
  
  <!-- Aravalli Hills Horizon (Alwar Rajasthan) -->
  <path d="M0,180 L150,110 L300,160 L450,90 L620,150 L800,100 L800,230 L0,230 Z" fill="#b45309" opacity="0.35"/>
  <path d="M0,200 L200,150 L420,190 L600,140 L800,180 L800,260 L0,260 Z" fill="#78350f" opacity="0.45"/>

  <!-- Thriving Pastureland Basin -->
  <rect y="220" width="800" height="280" fill="url(#grassChauka)"/>

  <!-- Chauka System Dykes (Interconnected Infiltration Bunds) -->
  <!-- Cell 1 (Left) -->
  <polygon points="60,260 260,260 240,360 40,360" fill="#0284c7" fill-opacity="0.75" stroke="#78350f" stroke-width="8"/>
  <text x="90" y="315" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">CHAUKA DYKE #1</text>
  
  <!-- Cell 2 (Center) -->
  <polygon points="290,260 510,260 530,360 270,360" fill="#0284c7" fill-opacity="0.8" stroke="#78350f" stroke-width="8"/>
  <text x="330" y="315" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">WATER RETENTION</text>

  <!-- Cell 3 (Right) -->
  <polygon points="540,260 740,260 760,360 560,360" fill="#0284c7" fill-opacity="0.75" stroke="#78350f" stroke-width="8"/>
  <text x="590" y="315" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">CHAUKA DYKE #2</text>

  <!-- Lower Spillway Overflow Channel -->
  <polygon points="120,380 680,380 720,480 80,480" fill="#15803d" stroke="#b45309" stroke-width="6"/>

  <!-- Native Khejri Trees (Rajasthan Drought Resilience) -->
  <circle cx="160" cy="220" r="28" fill="#166534"/>
  <rect x="156" y="240" width="8" height="25" fill="#451a03"/>

  <circle cx="640" cy="210" r="32" fill="#14532d"/>
  <rect x="636" y="235" width="8" height="28" fill="#451a03"/>

  <!-- Forensic Badge Overlay -->
  <rect x="25" y="25" width="360" height="58" rx="12" fill="#0f172a" fill-opacity="0.85"/>
  <text x="42" y="48" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">CHAUKA GRASSLAND MOISTURE SYSTEM</text>
  <text x="42" y="68" fill="#94a3b8" font-family="sans-serif" font-size="11">Arvari Catchment (Alwar) • Biomass Recovery Active</text>
</svg>
