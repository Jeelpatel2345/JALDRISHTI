<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyPercolation" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="tankWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" fill="url(#skyPercolation)"/>
  
  <!-- Western Ghats / Deccan Ridge -->
  <path d="M0,200 Q200,140 400,190 T800,170 L800,300 L0,300 Z" fill="#15803d" opacity="0.5"/>

  <!-- Field Base -->
  <rect y="230" width="800" height="270" fill="#166534"/>

  <!-- Percolation Tank Masonry Waste Weir & Infiltration Basin -->
  <ellipse cx="400" cy="370" rx="320" ry="110" fill="#94a3b8" stroke="#475569" stroke-width="6"/>
  <ellipse cx="400" cy="370" rx="290" ry="95" fill="url(#tankWater)"/>
  <ellipse cx="380" cy="360" rx="220" ry="65" fill="#38bdf8" opacity="0.4"/>

  <!-- Silt Trap Inflow Structure -->
  <polygon points="120,330 180,330 170,390 130,390" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <text x="110" y="415" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">SILT TRAP</text>

  <!-- Surrounding Recharged Horticulture -->
  <circle cx="80" cy="270" r="26" fill="#22c55e"/>
  <circle cx="120" cy="250" r="30" fill="#16a34a"/>
  <circle cx="680" cy="250" r="32" fill="#16a34a"/>
  <circle cx="730" cy="270" r="28" fill="#22c55e"/>

  <!-- Forensic Badge Overlay -->
  <rect x="25" y="25" width="340" height="58" rx="12" fill="#0f172a" fill-opacity="0.85"/>
  <text x="42" y="48" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">PERCOLATION RECHARGE TANK</text>
  <text x="42" y="68" fill="#94a3b8" font-family="sans-serif" font-size="11">Ralegan Siddhi Sub-Basin • Aquifer Saturated</text>
</svg>
