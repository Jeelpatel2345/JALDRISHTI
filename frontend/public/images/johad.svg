<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyJohad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="johadWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="220" fill="url(#skyJohad)"/>

  <!-- Distant Aravalli ridge -->
  <path d="M0,190 Q200,120 400,180 T800,160 L800,260 L0,260 Z" fill="#ca8a04" opacity="0.4"/>

  <!-- Semi-arid landscape -->
  <rect y="220" width="800" height="280" fill="#65a30d"/>

  <!-- Traditional Crescent Earthen Bund -->
  <path d="M100,480 C100,280 700,280 700,480 L650,490 C650,320 150,320 150,490 Z" fill="#92400e" stroke="#78350f" stroke-width="4"/>

  <!-- Impounded Johad Water Basin -->
  <ellipse cx="400" cy="380" rx="240" ry="85" fill="url(#johadWater)"/>
  <ellipse cx="400" cy="375" rx="200" ry="60" fill="#38bdf8" opacity="0.3"/>

  <!-- Riparian green pasture around pond -->
  <path d="M120,440 Q400,320 680,440" stroke="#166534" stroke-width="12" fill="none" opacity="0.8"/>

  <!-- Forensic Badge Overlay -->
  <rect x="25" y="25" width="320" height="58" rx="12" fill="#0f172a" fill-opacity="0.85"/>
  <text x="42" y="48" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">TRADITIONAL EARTHEN JOHAD</text>
  <text x="42" y="68" fill="#94a3b8" font-family="sans-serif" font-size="11">Alwar Basin • Groundwater Recharging</text>
</svg>
